<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="置き時計">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>置き時計</title>
<style>
/* 画面の黒い点（表示しない部分）を避けて、時計・天気・カレンダーの3ブロックを自動で並べ替える。
   大きさは vmin（画面の短い辺の1%）基準で、どの向きでも同じ比率になる。
   有機ELの焼き付き対策：黒背景・真っ白を使わない・1分ごとに数pxずらす。 */
:root {
  --bg: #000;
  --fg: #d9dde3;
  --muted: #a3abb6;
  --faint: #5c6470;
  --accent: #f0b35a;
  --sun: #e8786f;
  --sat: #6fa3e8;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --s: 1;                 /* 全体の縮尺（はみ出すときに自動で下げる） */
  color-scheme: dark;
}
body.night {
  --fg: #b8604f; --muted: #8a4a3f; --faint: #5e3027;
  --accent: #c0644f; --sun: #a8574a; --sat: #7a4a44;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
.stage {
  position: fixed; inset: 0;
  display: grid;
  gap: calc(3vmin * var(--s));
  padding-top: max(10px, var(--it, env(safe-area-inset-top, 0px)));
  padding-right: max(14px, var(--ir, env(safe-area-inset-right, 0px)));
  padding-bottom: max(10px, var(--ib, env(safe-area-inset-bottom, 0px)));
  padding-left: max(14px, var(--il, env(safe-area-inset-left, 0px)));
}
.stage.shift { transition: transform 3s ease; }
.cell { min-width: 0; min-height: 0; display: grid; gap: calc(1.2vmin * var(--s)); align-content: start; }
#cClock { grid-area: clock; }
#cDate { grid-area: date; }
#cWx { grid-area: wx; }
#cCal { grid-area: cal; }

.date { font-size: calc(9.5vmin * var(--s)); color: var(--fg); font-weight: 700; letter-spacing: .02em; white-space: nowrap; line-height: 1.1; }
.date b { color: var(--accent); font-weight: 700; }
.clock { font-size: calc(33vmin * var(--s)); font-weight: 500; line-height: .9; letter-spacing: -.02em; white-space: nowrap; }
/* 測る範囲を行の高さにそろえる（文字の上下の余白で「はみ出し」と誤判定しない） */
#date, .clock > span { display: inline-block; }
.clock .sec { font-size: .22em; color: var(--muted); font-weight: 600; margin-left: .12em; }
.colon { opacity: .7; }

/* 天気：上段に「アイコン・気温・概況」、細い線の下に3時間ごとの予報を同じ幅で並べる */
#cWx { width: max-content; max-width: 100%; }
.wxnow { display: flex; align-items: center; gap: calc(2.4vmin * var(--s)); }
.wxnow svg { width: calc(11vmin * var(--s)); height: calc(11vmin * var(--s)); flex: none; color: var(--fg); }
.wx-temp { font-size: calc(14vmin * var(--s)); font-weight: 600; color: var(--accent); line-height: 1; white-space: nowrap; }
.wx-temp small { font-size: .42em; color: var(--muted); }
.wx-text { display: grid; gap: calc(.8vmin * var(--s)); font-size: calc(4.2vmin * var(--s)); color: var(--muted); padding-left: calc(1vmin * var(--s)); }
.wx-text .cond { color: var(--fg); font-size: 1.12em; white-space: nowrap; }
.wx-text .hi { color: var(--sun); } .wx-text .lo { color: var(--sat); }
.nw { white-space: nowrap; }
.hours {
  display: grid; grid-template-columns: repeat(5, minmax(calc(10vmin * var(--s)), 1fr));
  border-top: 1px solid var(--faint); padding-top: calc(1.6vmin * var(--s));
  font-size: calc(3.7vmin * var(--s)); color: var(--muted);
}
.hours > div { display: grid; justify-items: center; gap: calc(.5vmin * var(--s)); }
.hours svg { width: calc(6.4vmin * var(--s)); height: calc(6.4vmin * var(--s)); color: var(--fg); }
.hours .t { color: var(--fg); font-size: 1.1em; }
.hours .p { font-size: .85em; }
.stamp { font-size: calc(2.8vmin * var(--s)); color: var(--faint); white-space: nowrap; }

.cal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; }
.cal-head .m { font-size: calc(6vmin * var(--s)); font-weight: 700; }
.cal-head .y { font-size: calc(3.5vmin * var(--s)); color: var(--muted); white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(7, calc(9.6vmin * var(--s))); text-align: center; }
.grid .dow { font-size: calc(3.3vmin * var(--s)); color: var(--muted); padding-bottom: calc(1vmin * var(--s)); }
.grid .d { font-size: calc(4.7vmin * var(--s)); line-height: 1; padding: calc(1.5vmin * var(--s)) 0; border-radius: 999px; }
.grid .out { visibility: hidden; }
.grid .sun, .grid .hol { color: var(--sun); }
.grid .sat { color: var(--sat); }
.grid .today { background: var(--accent); color: var(--bg); font-weight: 800; }
.holiday { font-size: calc(3.5vmin * var(--s)); color: var(--muted); }
.holiday b { color: var(--fg); font-weight: 700; }

/* 操作バー（画面をタップしたときだけ出す） */
.bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: max(10px, env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  z-index: 20;
}
.bar[hidden] { display: none !important; }
.btn {
  font: 14px var(--font); color: #e6e9ee; background: #1b1f25; border: 1px solid #333a44;
  padding: 9px 14px; border-radius: 999px;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 位置合わせ */
.calib { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.0); }
.ring {
  position: fixed; border: 2px dashed #f0b35a; border-radius: 50%;
  pointer-events: none; z-index: 31;
}
/* 黒い点を「日食の太陽」に見立てる飾り。点の外側だけを淡く光らせ、ゆっくり回して焼き付きを防ぐ */
.halo { position: fixed; pointer-events: none; z-index: 1; border-radius: 50%;
  --h: 240, 179, 90; --ha: 1;
  animation: breathe 14s ease-in-out infinite; }
body.night .halo { --h: 192, 100, 79; --ha: .55; }
.halo::before, .halo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
.halo::before {
  background: radial-gradient(circle closest-side,
    rgba(var(--h), 0) 0 61%,
    rgba(var(--h), calc(.95 * var(--ha))) 64.5%,
    rgba(var(--h), calc(.38 * var(--ha))) 68%,
    rgba(var(--h), calc(.14 * var(--ha))) 80%,
    rgba(var(--h), 0) 100%);
}
.halo::after {
  background: repeating-conic-gradient(from 0deg,
    rgba(var(--h), 0) 0deg, rgba(var(--h), calc(.32 * var(--ha))) 7deg, rgba(var(--h), 0) 16deg,
    rgba(var(--h), 0) 26deg, rgba(var(--h), calc(.18 * var(--ha))) 31deg, rgba(var(--h), 0) 40deg);
  -webkit-mask: radial-gradient(circle closest-side, transparent 0 63%, #000 66%, transparent 100%);
          mask: radial-gradient(circle closest-side, transparent 0 63%, #000 66%, transparent 100%);
  animation: spin 300s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .halo, .halo::after { animation: none; } }
.calib-msg {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 32;
  font-size: 15px; color: #e6e9ee; background: #1b1f25; padding: 10px 14px; border-radius: 12px;
  text-align: center; line-height: 1.6; max-width: 90vw;
}
.calib-msg .row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <section class="cell" id="cDate">
    <div class="date"><span id="date"></span></div>
  </section>
  <section class="cell" id="cClock">
    <div class="clock" id="clock"></div>
  </section>
  <section class="cell" id="cWx">
    <div class="wxnow">
      <span id="wxIcon"></span>
      <span class="wx-temp" id="wxTemp">--<small>℃</small></span>
      <span class="wx-text"><span class="cond" id="wxCond">天気を取得中</span><span id="wxSub"></span></span>
    </div>
    <div class="hours" id="hours"></div>
    <div class="stamp"><span id="stamp"></span></div>
  </section>
  <section class="cell" id="cCal">
    <div class="cal-head"><span class="m" id="calM"></span><span class="y" id="calY"></span></div>
    <div class="grid" id="grid"></div>
    <div class="holiday"><span id="holiday"></span></div>
  </section>
</main>

<div class="halo" id="halo" hidden></div>
<div class="bar" id="bar" hidden>
  <button class="btn" id="bCalib" type="button">黒い点の位置を合わせる</button>
  <button class="btn" id="bHalo" type="button">点の飾り：オン</button>
  <button class="btn" id="bClose" type="button">閉じる</button>
</div>

<div id="calibLayer" hidden>
  <div class="calib" id="calib"></div>
  <div class="ring" id="ring"></div>
  <div class="calib-msg" id="calibMsg">
    黒い点の真ん中をタップしてください。<br>点線の円が黒い点をすっぽり囲めばOKです。
    <div class="row">
      <button class="btn" id="bSmall" type="button">円を小さく</button>
      <button class="btn" id="bBig" type="button">円を大きく</button>
      <button class="btn" id="bReset" type="button">最初の位置に戻す</button>
      <button class="btn" id="bDone" type="button">完了</button>
    </div>
  </div>
</div>

<script>
// ===== 設定 =====
const VERSION = "2026-11-08g";   // 直したらここと version.txt を同じ値にする
const PLACE = { name: "富山市", lat: 36.6953, lon: 137.2113 };
const NIGHT_FROM = 22, NIGHT_TO = 6;
const WEATHER_EVERY_MIN = 15;
// 黒い点の位置（縦向き・画面左上を0、幅と高さに対する割合）と半径（幅に対する割合）。写真から測った初期値
const DOT_DEFAULT = { x: 0.564, y: 0.252, r: 0.085 };
const DOT_MARGIN = 10;   // 点のまわりに空ける余白(px)
const HALO = 1.55;       // 飾りの外径（点の半径の何倍か）
const SHIFT = 3;         // 焼き付き対策で動かす幅(±px)

let HOLIDAYS = {
  "2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日","2026-02-23":"天皇誕生日",
  "2026-03-20":"春分の日","2026-04-29":"昭和の日","2026-05-03":"憲法記念日","2026-05-04":"みどりの日",
  "2026-05-05":"こどもの日","2026-05-06":"休日","2026-07-20":"海の日","2026-08-11":"山の日",
  "2026-09-21":"敬老の日","2026-09-22":"休日","2026-09-23":"秋分の日","2026-10-12":"スポーツの日",
  "2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
  "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日",
  "2027-03-21":"春分の日","2027-03-22":"休日","2027-04-29":"昭和の日","2027-05-03":"憲法記念日",
  "2027-05-04":"みどりの日","2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日",
  "2027-09-20":"敬老の日","2027-09-23":"秋分の日","2027-10-11":"スポーツの日","2027-11-03":"文化の日",
  "2027-11-23":"勤労感謝の日"
};

const $ = id => document.getElementById(id);
const DOW = ["日","月","火","水","木","金","土"];
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

// 確認用（PCで試すとき）: ?angle=90|270|0&inset=上,右,下,左
const Q = new URLSearchParams(location.search);
if (Q.get("inset")) {
  const [t, r, b, l] = Q.get("inset").split(",").map(v => v + "px");
  const st = document.documentElement.style;
  st.setProperty("--it", t); st.setProperty("--ir", r); st.setProperty("--ib", b); st.setProperty("--il", l);
}

// ===== 画面の向きと黒い点の位置 =====
function angle() {
  if (Q.get("angle") !== null) return (Number(Q.get("angle")) + 360) % 360;
  if (screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle % 360;
  if (typeof window.orientation === "number") return (window.orientation + 360) % 360;
  return innerWidth > innerHeight ? 90 : 0;
}
function dotKey() { return `okidokei-dot:${angle()}:${innerWidth}x${innerHeight}`; }
// 縦向きの割合 → 今の画面の座標（ホーム画面から全画面で開いた前提）
function defaultDot() {
  const W = innerWidth > innerHeight ? innerHeight : innerWidth;   // 画面の短い辺
  const H = innerWidth > innerHeight ? innerWidth : innerHeight;   // 画面の長い辺
  const px = DOT_DEFAULT.x * W, py = DOT_DEFAULT.y * H, r = DOT_DEFAULT.r * W;
  const a = angle();
  if (a === 90)  return { x: py, y: W - px, r };      // 上側（受話口）が左
  if (a === 270) return { x: H - py, y: px, r };      // 上側（受話口）が右
  if (a === 180) return { x: W - px, y: H - py, r };
  return { x: px, y: py, r };
}
function getDot() { return store.get(dotKey()) || defaultDot(); }

// ===== 配置の候補 =====
function templates() {
  const L = [];
  if (innerWidth > innerHeight) {
    // 上段に時計と日付を横並び、下段に天気とカレンダー（横向きの基本形）
    for (const topFirst of [true, false]) for (const clockLeft of [true, false]) for (const wxLeft of [true, false]) {
      const top = clockLeft ? "clock date" : "date clock";
      const bottom = wxLeft ? "wx cal" : "cal wx";
      L.push({
        areas: topFirst ? `"${top}" "${bottom}"` : `"${bottom}" "${top}"`,
        cols: clockLeft === wxLeft ? "minmax(0,1.15fr) minmax(0,1fr)" : "minmax(0,1fr) minmax(0,1.15fr)",
        rows: topFirst ? "auto minmax(0,1fr)" : "minmax(0,1fr) auto"
      });
    }
    // カレンダーを縦一列に置き、反対側に日付・時計・天気を積む
    for (const calRight of [true, false]) for (const order of [["date","clock","wx"], ["wx","date","clock"]]) {
      L.push({
        areas: order.map(a => calRight ? `"${a} cal"` : `"cal ${a}"`).join(" "),
        cols: calRight ? "minmax(0,1.3fr) minmax(0,1fr)" : "minmax(0,1fr) minmax(0,1.3fr)",
        rows: order[2] === "wx" ? "auto auto minmax(0,1fr)" : "minmax(0,1fr) auto auto"
      });
    }
  } else {
    const perms = [["T","wx","cal"],["wx","T","cal"],["T","cal","wx"],["cal","T","wx"],["wx","cal","T"],["cal","wx","T"]];
    for (const p of perms) for (const ac of ["space-evenly", "start", "end", "space-between", "center"]) {
      L.push({ areas: p.map(a => a === "T" ? `"date" "clock"` : `"${a}"`).join(" "), cols: "minmax(0,1fr)", rows: "auto auto auto auto", alignContent: ac });
    }
  }
  return L;
}
const ALIGNS = [["center","center"],["start","start"],["end","end"],["start","end"],["end","start"],
                ["center","start"],["center","end"],["start","center"],["end","center"]];
// ブロックごとに見栄えのよい寄せ方から試す（時計と天気は左端をそろえる）
const LEFT_FIRST = [["start","center"],["start","start"],["start","end"]];
const PREF = {
  cClock: [...LEFT_FIRST, ...ALIGNS],
  cWx: [["start","end"],["start","start"],["start","center"], ...ALIGNS],
  // 日付とカレンダーは間を空けず寄せる（日付が上段なら下寄せ、カレンダーは上寄せ）
  cDate: [["center","end"],["center","start"],["center","center"], ...ALIGNS],
  cCal: [["center","start"],["center","end"],["center","center"], ...ALIGNS]
};
const CELLS = {
  cDate: "#date",
  cClock: "#clock > span",
  cWx: "#wxIcon svg, #wxTemp, #wxCond, #wxSub .nw, #hours > div, #stamp",
  cCal: "#calM, #calY, #grid > div:not(.out), #holiday"
};

// 重なり・はみ出しの点数（0なら合格）
function cellScore(id, dot, box) {
  let score = 0;
  const R = dot ? (haloOn() ? dot.r * HALO + 2 : dot.r + DOT_MARGIN) + SHIFT : 0;
  for (const el of document.querySelectorAll(CELLS[id])) {
    const b = el.getBoundingClientRect();
    if (!b.width || !b.height) continue;
    const T = 4;   // 余白への数pxのはみ出しは許す（焼き付き対策の移動幅と同じ程度）
    if (b.left < box.l - T || b.top < box.t - T || b.right > box.r + T || b.bottom > box.b + T) {
      score += 10000 + Math.max(0, box.l - b.left) + Math.max(0, box.t - b.top) + Math.max(0, b.right - box.r) + Math.max(0, b.bottom - box.b);
    }
    if (dot) {
      const cx = Math.max(b.left, Math.min(dot.x, b.right));
      const cy = Math.max(b.top, Math.min(dot.y, b.bottom));
      const d = Math.hypot(dot.x - cx, dot.y - cy);
      if (d < R) score += 1000 + (R - d) * 10;
    }
  }
  return score;
}
// ブロック（時計・日付・天気・カレンダー）同士が重なっていないか
function cellsOverlap() {
  const rects = Object.keys(CELLS).map(id => {
    let u = null;
    for (const el of document.querySelectorAll(CELLS[id])) {
      const b = el.getBoundingClientRect();
      if (!b.width || !b.height) continue;
      u = u ? { l: Math.min(u.l, b.left), t: Math.min(u.t, b.top), r: Math.max(u.r, b.right), b: Math.max(u.b, b.bottom) }
            : { l: b.left, t: b.top, r: b.right, b: b.bottom };
    }
    return u;
  }).filter(Boolean);
  let sc = 0;
  for (let i = 0; i < rects.length; i++) for (let j = i + 1; j < rects.length; j++) {
    const a = rects[i], b = rects[j];
    const w = Math.min(a.r, b.r) - Math.max(a.l, b.l), h = Math.min(a.b, b.b) - Math.max(a.t, b.t);
    if (w > 0 && h > 0) sc += 5000 + w * h;
  }
  return sc;
}
function contentBox() {
  const cs = getComputedStyle($("stage"));
  return {
    l: parseFloat(cs.paddingLeft), t: parseFloat(cs.paddingTop),
    r: innerWidth - parseFloat(cs.paddingRight), b: innerHeight - parseFloat(cs.paddingBottom)
  };
}
function applyTemplate(t) {
  const st = $("stage").style;
  st.gridTemplateAreas = t.areas; st.gridTemplateColumns = t.cols; st.gridTemplateRows = t.rows;
  st.alignContent = t.alignContent || "stretch";
}
function setAlign(id, a) { const s = $(id).style; s.justifySelf = a[0]; s.alignSelf = a[1]; }

let layoutTimer = null;
function relayout() { clearTimeout(layoutTimer); layoutTimer = setTimeout(doLayout, 50); }
function doLayout() {
  const stage = $("stage");
  stage.classList.remove("shift");
  stage.style.transform = "none";
  const dot = getDot();
  const box = contentBox();
  let best = null;
  // 粗く探して、通った縮尺の一段上を細かく試す（できるだけ大きく表示する）
  const tryScale = s => {
    document.documentElement.style.setProperty("--s", s);
    for (const t of templates()) {
      applyTemplate(t);
      for (const id in CELLS) setAlign(id, PREF[id][0]);
      const aligns = {}; let total = 0;
      for (const id in CELLS) {
        let bestA = null;
        for (const a of PREF[id]) {
          setAlign(id, a);
          const sc = cellScore(id, dot, box);
          if (!bestA || sc < bestA.sc) bestA = { a, sc };
          if (sc === 0) break;
        }
        setAlign(id, bestA.a); aligns[id] = bestA.a; total += bestA.sc;
      }
      total += cellsOverlap();
      if (!best || total < best.total || (total === best.total && s > best.s)) best = { s, t, aligns, total };
      if (total === 0) return true;
    }
    return false;
  };
  const coarse = [1, .9, .8, .7, .6, .5];
  for (let i = 0; i < coarse.length; i++) {
    if (tryScale(coarse[i])) {
      if (i > 0) {
        const pass = best;
        for (const f of [.08, .06, .04, .02]) {
          best = null;
          if (tryScale(+(coarse[i] + f).toFixed(2))) break;
          best = pass;
        }
        if (!best || best.total !== 0) best = pass;
      }
      break;
    }
  }
  document.documentElement.style.setProperty("--s", best.s);
  applyTemplate(best.t);
  for (const id in best.aligns) setAlign(id, best.aligns[id]);
  placeHalo(dot);
  requestAnimationFrame(() => { stage.classList.add("shift"); shiftStage(); });
}
function haloOn() { return store.get("okidokei-halo") !== false; }
function placeHalo(dot) {
  const h = $("halo");
  h.hidden = !haloOn() || !dot;
  $("bHalo").textContent = `点の飾り：${haloOn() ? "オン" : "オフ"}`;
  if (h.hidden) return;
  const R = dot.r * HALO;
  h.style.left = (dot.x - R) + "px"; h.style.top = (dot.y - R) + "px";
  h.style.width = h.style.height = (R * 2) + "px";
}
function shiftStage() {
  const dx = Math.round(Math.random() * SHIFT * 2 - SHIFT), dy = Math.round(Math.random() * SHIFT * 2 - SHIFT);
  $("stage").style.transform = `translate(${dx}px, ${dy}px)`;
}

// ===== 時計 =====
let lastMinute = -1, lastDay = "";
function tick() {
  const now = new Date();
  $("clock").innerHTML =
    `<span>${now.getHours()}</span><span class="colon">:</span><span>${pad(now.getMinutes())}</span><span class="sec">${pad(now.getSeconds())}</span>`;
  if (now.getMinutes() !== lastMinute) { lastMinute = now.getMinutes(); onMinute(now); }
  setTimeout(tick, 1000 - now.getMilliseconds() + 5);
}
function onMinute(now) {
  const key = ymd(now), hol = HOLIDAYS[key];
  $("date").innerHTML = `${now.getMonth()+1}月${now.getDate()}日 <b>${DOW[now.getDay()]}曜日</b>${hol ? `　${hol}` : ""}`;
  const h = now.getHours();
  document.body.classList.toggle("night", h >= NIGHT_FROM || h < NIGHT_TO);
  const hourChanged = now.getMinutes() === 0;   // 時の桁数が変わると幅が変わるので並べ直す
  if (key !== lastDay) { lastDay = key; renderCalendar(now); relayout(); }
  else if (hourChanged) relayout();
  else shiftStage();
}

// ===== カレンダー =====
function renderCalendar(now) {
  const y = now.getFullYear(), m = now.getMonth();
  $("calM").textContent = `${m+1}月`;
  $("calY").textContent = `${y}年（令和${y - 2018}年）`;
  const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate();
  // 月曜始まり（月〜日）
  const order = [1, 2, 3, 4, 5, 6, 0];
  let html = order.map(i => `<div class="dow ${i===0?"sun":i===6?"sat":""}">${DOW[i]}</div>`).join("");
  for (let i = 0; i < (first.getDay() + 6) % 7; i++) html += `<div class="d out">0</div>`;
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), wd = dt.getDay(), k = ymd(dt), cls = ["d"];
    if (wd === 0) cls.push("sun"); if (wd === 6) cls.push("sat");
    if (HOLIDAYS[k]) cls.push("hol");
    if (d === now.getDate()) cls.push("today");
    html += `<div class="${cls.join(" ")}">${d}</div>`;
  }
  $("grid").innerHTML = html;
  const today = ymd(now);
  const next = Object.keys(HOLIDAYS).sort().find(k => k > today);
  if (next) {
    const nd = new Date(next + "T00:00:00");
    const diff = Math.round((nd - new Date(y, m, now.getDate())) / 86400000);
    $("holiday").innerHTML = `次の祝日 <b>${nd.getMonth()+1}/${nd.getDate()}（${DOW[nd.getDay()]}）${HOLIDAYS[next]}</b> あと${diff}日`;
  } else $("holiday").textContent = "";
}
async function loadHolidays() {
  try {
    const r = await fetch("https://holidays-jp.github.io/api/v1/date.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    HOLIDAYS = Object.assign({}, HOLIDAYS, await r.json());
    lastDay = ""; onMinute(new Date());
  } catch (e) { /* 控えの祝日で続ける */ }
}

// ===== 天気（Open-Meteo） =====
function wxInfo(code) {
  if (code === 0) return ["快晴", "sun"];
  if (code === 1) return ["晴れ", "sun"];
  if (code === 2) return ["晴れ時々くもり", "partly"];
  if (code === 3) return ["くもり", "cloud"];
  if (code === 45 || code === 48) return ["霧", "fog"];
  if (code >= 51 && code <= 57) return ["霧雨", "rain"];
  if (code >= 61 && code <= 67) return [code >= 65 ? "強い雨" : "雨", "rain"];
  if (code >= 71 && code <= 77) return [code >= 75 ? "大雪" : "雪", "snow"];
  if (code >= 80 && code <= 82) return ["にわか雨", "rain"];
  if (code === 85 || code === 86) return ["にわか雪", "snow"];
  if (code >= 95) return ["雷雨", "thunder"];
  return ["―", "cloud"];
}
function icon(kind, night) {
  const s = `fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"`;
  const sun = night
    ? `<path d="M30 10a14 14 0 1 0 14 18A11 11 0 0 1 30 10z" ${s}/>`
    : `<circle cx="32" cy="24" r="9" ${s}/><g ${s}><path d="M32 6v4M32 38v4M14 24h4M46 24h4M19 11l3 3M42 34l3 3M45 11l-3 3M22 34l-3 3"/></g>`;
  const cloud = `<path d="M18 46h28a9 9 0 0 0 0-18 13 13 0 0 0-25-2 10 10 0 0 0-3 20z" ${s}/>`;
  const small = `<path d="M18 40h28a9 9 0 0 0 0-18 13 13 0 0 0-25-2 10 10 0 0 0-3 14z" ${s}/>`;
  const map = {
    sun, cloud,
    partly: `<g transform="translate(-6,-6) scale(.8)">${sun}</g>${cloud}`,
    fog: `<g ${s}><path d="M12 24h40M8 32h44M14 40h36M18 48h28"/></g>`,
    rain: `${small}<g ${s}><path d="M24 48l-2 6M33 48l-2 6M42 48l-2 6"/></g>`,
    snow: `${small}<g ${s}><path d="M24 50v4M22 52h4M34 50v4M32 52h4M44 50v4M42 52h4"/></g>`,
    thunder: `${small}<path d="M34 42l-5 8h6l-4 8" ${s}/>`
  };
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${map[kind] || cloud}</svg>`;
}
async function loadWeather() {
  const url = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${PLACE.lat}&longitude=${PLACE.lon}`
    + "&current=temperature_2m,weather_code,is_day"
    + "&hourly=temperature_2m,weather_code,precipitation_probability,is_day"
    + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"
    + "&timezone=Asia%2FTokyo&forecast_days=2";
  try {
    const r = await fetch(url, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const w = await r.json(), c = w.current, dl = w.daily;
    const [label, kind] = wxInfo(c.weather_code);
    $("wxIcon").innerHTML = icon(kind, c.is_day === 0);
    $("wxTemp").innerHTML = `${Math.round(c.temperature_2m)}<small>℃</small>`;
    $("wxCond").textContent = `${PLACE.name} ${label}`;
    $("wxSub").innerHTML =
      `<span class="nw">最高 <span class="hi">${Math.round(dl.temperature_2m_max[0])}°</span>　最低 <span class="lo">${Math.round(dl.temperature_2m_min[0])}°</span></span><br><span class="nw">降水確率 ${dl.precipitation_probability_max[0] ?? "-"}%</span>`;
    const nowH = new Date(); nowH.setMinutes(0, 0, 0);
    const idx0 = w.hourly.time.findIndex(t => new Date(t) >= nowH);
    let hs = "";
    for (let k = 1; k <= 5 && idx0 >= 0; k++) {
      const i = idx0 + k * 3; if (i >= w.hourly.time.length) break;
      const [, hk] = wxInfo(w.hourly.weather_code[i]);
      hs += `<div><span>${new Date(w.hourly.time[i]).getHours()}時</span>${icon(hk, w.hourly.is_day[i] === 0)}<span class="t">${Math.round(w.hourly.temperature_2m[i])}°</span><span class="p">${w.hourly.precipitation_probability[i] ?? "-"}%</span></div>`;
    }
    $("hours").innerHTML = hs;
    const u = new Date();
    $("stamp").textContent = `天気 ${u.getHours()}:${pad(u.getMinutes())} 更新　版 ${VERSION}`;
  } catch (e) {
    $("stamp").textContent = "天気を取得できませんでした（1分後に再試行）";
    setTimeout(loadWeather, 60000);
  }
  relayout();
}

// ===== 画面を消さない =====
let lock = null;
async function keepAwake() {
  try {
    if ("wakeLock" in navigator && !lock) {
      lock = await navigator.wakeLock.request("screen");
      lock.addEventListener("release", () => { lock = null; });
    }
  } catch (e) { lock = null; }
}

// ===== 操作バーと位置合わせ =====
let barTimer = null;
function showBar() {
  $("bar").hidden = false;
  clearTimeout(barTimer);
  barTimer = setTimeout(() => { $("bar").hidden = true; }, 8000);
}
$("stage").addEventListener("click", () => { keepAwake(); showBar(); });
$("bHalo").addEventListener("click", e => { e.stopPropagation(); store.set("okidokei-halo", !haloOn()); relayout(); });
$("bClose").addEventListener("click", e => { e.stopPropagation(); $("bar").hidden = true; });

let calibDot = null;
function drawRing() {
  const d = calibDot, ring = $("ring");
  ring.style.left = (d.x - d.r) + "px"; ring.style.top = (d.y - d.r) + "px";
  ring.style.width = ring.style.height = (d.r * 2) + "px";
  // 説明文は円から遠い側（上か下）に出す
  const msg = $("calibMsg");
  if (d.y < innerHeight / 2) { msg.style.top = ""; msg.style.bottom = "max(12px, env(safe-area-inset-bottom, 0px))"; }
  else { msg.style.bottom = ""; msg.style.top = "max(12px, env(safe-area-inset-top, 0px))"; }
}
$("bCalib").addEventListener("click", e => {
  e.stopPropagation();
  $("bar").hidden = true;
  $("stage").style.visibility = "hidden";       // 画面を真っ黒にして、点を見やすくする
  $("halo").hidden = true;
  calibDot = Object.assign({}, getDot());
  $("calibLayer").hidden = false;
  drawRing();
});
$("calib").addEventListener("click", e => { calibDot.x = e.clientX; calibDot.y = e.clientY; drawRing(); });
$("bSmall").addEventListener("click", () => { calibDot.r = Math.max(8, calibDot.r - 4); drawRing(); });
$("bBig").addEventListener("click", () => { calibDot.r = Math.min(160, calibDot.r + 4); drawRing(); });
$("bReset").addEventListener("click", () => { store.del(dotKey()); calibDot = Object.assign({}, defaultDot()); drawRing(); });
$("bDone").addEventListener("click", () => {
  store.set(dotKey(), calibDot);
  $("calibLayer").hidden = true;
  $("stage").style.visibility = "";
  relayout();
});

// Safariのタブで開いているときだけ、全画面の開き方を案内する
if (/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone && !matchMedia("(display-mode: standalone)").matches) {
  const n = document.createElement("div");
  n.className = "calib-msg";
  n.style.top = "max(12px, env(safe-area-inset-top, 0px))";
  n.innerHTML = "いまはSafariのタブで開いています。<br>共有ボタン →「ホーム画面に追加」で「Webアプリとして開く」をオンにして追加し、<br>そのアイコンから開くと全画面になります。";
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 15000);
}

// ===== 新しい版が出ていたら自動で読み直す =====
async function checkUpdate() {
  try {
    const r = await fetch(`version.txt?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (v && v !== VERSION) location.replace(`./?v=${encodeURIComponent(v)}`);   // URLを変えて保存済みの古い画面を使わせない
  } catch (e) {}
}

// ===== 起動 =====
addEventListener("resize", relayout);
addEventListener("orientationchange", () => setTimeout(relayout, 300));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { checkUpdate(); keepAwake(); loadWeather(); lastDay = ""; onMinute(new Date()); }
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

tick();
loadHolidays();
loadWeather();
keepAwake();
setInterval(loadWeather, WEATHER_EVERY_MIN * 60000);
setInterval(loadHolidays, 24 * 3600000);
setInterval(checkUpdate, 5 * 60000);
checkUpdate();
</script>
